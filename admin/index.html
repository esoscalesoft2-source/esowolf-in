<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Blog Admin — ESOWOLF</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/admin/app.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script type="module" src="/admin/app.js?v=2"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="/admin/"><img src="/assets/eso-logo-light.webp" alt="ESOWOLF" width="1000" height="479"><span>Blog Admin</span></a>
  <nav id="tabs" hidden>
    <button data-tab="posts">Posts</button>
    <button data-tab="calendar">Content calendar</button>
    <button data-tab="team" data-owner>Team</button>
  </nav>
  <div class="who" id="who" hidden><span id="whoName"></span><button class="link" id="logout" type="button">Log out</button></div>
</header>
<main id="app"><p class="muted center pad">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog"><p id="dlgText"></p><div class="row end"><button value="no" class="btn ghost">Cancel</button><button value="yes" class="btn danger" id="dlgYes">Yes</button></div></form></dialog>
<noscript><p class="pad">The admin needs JavaScript.</p></noscript>
</body>
</html>
